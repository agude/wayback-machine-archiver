# Callable CI. Every step calls a just recipe, so this file only changes when
# the shape of the pipeline changes — not when the tooling does.
#
# Called by tests.yml (push/PR) and release.yml (before publishing).
name: CI 🧪

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint 🧹
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv 💨
        uses: astral-sh/setup-uv@v8

      - name: Set up just 🤖
        uses: extractions/setup-just@v2

      - name: Install dependencies 🏗
        run: just sync

      - name: Lint 🔎
        run: just lint

      - name: Type check 🔍
        run: just type-check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    name: Python ${{ matrix.python-version }} Test 🧪
    # .python-version pins 3.14 for local work and uv honours it on the
    # runner too, so without this override every leg would test 3.14 while
    # reporting five different names.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv 💨
        uses: astral-sh/setup-uv@v8

      - name: Set up just 🤖
        uses: extractions/setup-just@v2

      - name: Set up Python ${{ matrix.python-version }} 🐍
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies 🏗
        run: just sync

      - name: Run tests 🧪
        run: just test

      # Catches packaging faults the suite cannot: a console script that
      # imports fine from the source tree but not from an installed wheel.
      - name: Run smoke test ⚗️
        run: |
          uv pip install .
          uv run archiver --help
